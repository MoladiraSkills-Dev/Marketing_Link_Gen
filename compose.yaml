name: ishortn

services:

  # ─── Database ────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    # Production collation; see drizzle/0060_*
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ishortn
      MYSQL_USER: ishortn
      MYSQL_PASSWORD: ishortn
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # TCP: the bootstrap server only listens on the socket and would pass a socket ping
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ─── Email: Mailpit ──────────────────────────────────────────────────────────
  # Catches all outgoing SMTP mail — nothing is delivered for real.
  # View sent emails at http://localhost:8025
  # Usage: docker compose --profile email up -d
  # App .env: SMTP_HOST=localhost  SMTP_PORT=1025
  mailpit:
    image: axllent/mailpit:latest
    profiles: [email]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP — app sends here
      - "${MAILPIT_UI_PORT:-8025}:8025"     # Web inbox — open in browser
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped

  # ─── Storage: MinIO ──────────────────────────────────────────────────────────
  # S3-compatible stand-in for Cloudflare R2 — for QR logos, bio avatars, OG images
  # Console: http://localhost:9001  login: ishortn / ishortn-secret
  # Usage: docker compose --profile storage up -d
  # App .env: uncomment the R2_* block in .env (R2_ENDPOINT=http://127.0.0.1:9000)
  minio:
    image: minio/minio:latest
    profiles: [storage]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ishortn
      MINIO_ROOT_PASSWORD: ishortn-secret
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    profiles: [storage]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ishortn ishortn-secret &&
        mc mb --ignore-existing local/ishortn-images &&
        mc anonymous set download local/ishortn-images
      "

  # ─── Analytics: Umami ────────────────────────────────────────────────────────
  # Self-hosted page-view analytics — open-source Google Analytics replacement
  # Dashboard: http://localhost:3002  default login: admin / umami
  # Usage: docker compose --profile analytics up -d
  # Then: create a website in Umami, copy tracking ID → UMAMI_TRACKING_ID in .env
  umami-db:
    image: postgres:15-alpine
    profiles: [analytics]
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: [analytics]
    ports:
      - "${UMAMI_PORT:-3002}:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: changeme-umami-secret-32chars-min
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped

  # ─── AI: Ollama ──────────────────────────────────────────────────────────────
  # Local LLM runner — replaces OpenAI for alias suggestions and URL classification
  # API: http://localhost:11434
  # Usage: docker compose --profile ai up -d
  # Then pull a model: docker exec ishortn-ollama-1 ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
  umami_db_data:
  ollama_data:
